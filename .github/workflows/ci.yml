name: RelayBase CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: relaybase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release and product gates
        run: npm run check
        env:
          DOC_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Audit production dependencies
        run: |
          # npm 10 (bundled with Node 22.13) posts to the retired
          # /-/npm/v1/security/audits/quick endpoint, which now always returns
          # 400. npm 11 uses the bulk advisory endpoint. Retry a few times so a
          # transient registry blip cannot fail the gate; a real high-severity
          # production advisory still fails every attempt and fails the build.
          npm install -g npm@^11
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            echo "npm audit attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
          echo "npm audit failed after 3 attempts"
          exit 1
